<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Manal Zareen - Full Stack Developer and CSE AI ML student">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B10"/>
      <stop offset="0.55" stop-color="#111722"/>
      <stop offset="1" stop-color="#171B2B"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7C4FF"/>
      <stop offset="0.5" stop-color="#7C8DFF"/>
      <stop offset="1" stop-color="#5867D8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8B9DFF" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8B9DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".38"/></filter>
    <clipPath id="orbClip"><circle cx="925" cy="260" r="145"/></clipPath>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="900" cy="250" r="260" fill="url(#glow)" filter="url(#blur)"/>

  <!-- subtle grid -->
  <g opacity=".08" stroke="#FFFFFF">
    <path d="M700 0V520M800 0V520M900 0V520M1000 0V520M1100 0V520"/>
    <path d="M650 80H1200M650 180H1200M650 280H1200M650 380H1200M650 480H1200"/>
  </g>

  <!-- orbit rings -->
  <g fill="none" stroke="#9AA8FF" opacity=".24">
    <ellipse cx="925" cy="260" rx="205" ry="78" transform="rotate(-18 925 260)"/>
    <ellipse cx="925" cy="260" rx="190" ry="62" transform="rotate(34 925 260)"/>
    <ellipse cx="925" cy="260" rx="165" ry="48" transform="rotate(78 925 260)"/>
  </g>

  <!-- central 3D-ish object -->
  <g filter="url(#shadow)">
    <circle cx="925" cy="260" r="145" fill="#0D111A" stroke="#7787F5" stroke-opacity=".38"/>
    <g clip-path="url(#orbClip)">
      <path d="M760 235 Q930 115 1090 225 Q930 305 760 370Z" fill="url(#orb)" opacity=".85"/>
      <path d="M780 315 Q940 210 1090 285 L1090 430 L780 430Z" fill="#4E5AC3" opacity=".7"/>
      <path d="M800 155 Q900 220 1060 150" fill="none" stroke="#D9DEFF" stroke-opacity=".55" stroke-width="3"/>
      <path d="M780 280 Q900 350 1090 265" fill="none" stroke="#D9DEFF" stroke-opacity=".28" stroke-width="2"/>
    </g>
    <circle cx="925" cy="260" r="145" fill="none" stroke="#C8D0FF" stroke-opacity=".28"/>
    <circle cx="882" cy="212" r="18" fill="#FFFFFF" opacity=".18"/>
  </g>

  <!-- floating nodes -->
  <g fill="#DCE2FF">
    <circle cx="725" cy="145" r="5"/>
    <circle cx="1080" cy="128" r="4"/>
    <circle cx="1110" cy="365" r="5"/>
    <circle cx="760" cy="390" r="4"/>
  </g>
  <g stroke="#9AA8FF" stroke-opacity=".5">
    <path d="M725 145L810 190"/>
    <path d="M1080 128L1030 170"/>
    <path d="M1110 365L1055 330"/>
    <path d="M760 390L820 345"/>
  </g>

  <!-- typography -->
  <g fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="92" font-size="18" letter-spacing="5" fill="#AAB5FF">MANAL ZAREEN</text>
    <text x="72" y="165" font-size="58" font-weight="700">FULL-STACK</text>
    <text x="72" y="228" font-size="58" font-weight="700">DEVELOPER.</text>
    <text x="72" y="276" font-size="20" fill="#B7BECF">B.Tech CSE · AI &amp; ML</text>
    <text x="72" y="322" font-size="16" fill="#8F98AA">Building interfaces, intelligent systems</text>
    <text x="72" y="347" font-size="16" fill="#8F98AA">and real-world prototypes.</text>
  </g>

  <!-- bottom metadata -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">
    <text x="72" y="445" fill="#AAB5FF">WEB</text>
    <text x="145" y="445" fill="#D0D5E0">AI / DATA</text>
    <text x="255" y="445" fill="#D0D5E0">MOBILE</text>
    <text x="350" y="445" fill="#D0D5E0">IOT</text>
    <text x="425" y="445" fill="#D0D5E0">HACKATHONS</text>
    <text x="72" y="475" fill="#5F687A">01</text>
    <text x="145" y="475" fill="#5F687A">02</text>
    <text x="255" y="475" fill="#5F687A">03</text>
    <text x="350" y="475" fill="#5F687A">04</text>
    <text x="425" y="475" fill="#5F687A">05</text>
  </g>
</svg>