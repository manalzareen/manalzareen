<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manal Zareen — CSE AI and ML Developer">

<title>Manal Zareen — Developer</title>
<desc>Minimal animated developer profile banner.</desc>

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F8FAFC"></stop>
    <stop offset="55%" stop-color="#EEF2F7"></stop>
    <stop offset="100%" stop-color="#FFFFFF"></stop>
  </linearGradient>

  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#94A3B8" stroke-opacity=".16"></path>
  </pattern>

  <filter id="soft">
    <feGaussianBlur stdDeviation="12"></feGaussianBlur>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1180" height="610" rx="28" fill="url(#bg)"></rect>

<rect x="1" y="1" width="1178" height="608" rx="28" fill="none" stroke="#CBD5E1"></rect>

<rect x="30" y="30" width="1120" height="550" rx="20" fill="url(#grid)"></rect>

<circle cx="260" cy="290" r="150" fill="#2563EB" opacity=".05" filter="url(#soft)">

  <animate attributeName="opacity" values=".02;.07;.02" dur="5s" repeatCount="indefinite"></animate>

</circle>

<!-- LEFT -->

<rect x="70" y="80" width="420" height="450" rx="18" fill="#FFFFFF" stroke="#CBD5E1"></rect>

