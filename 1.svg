<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Manal Zareen — CSE AI and ML Developer">

<title>Manal Zareen — Developer</title>
<desc>Cinematic animated developer profile banner.</desc>

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03060B"></stop>
    <stop offset="55%" stop-color="#07101C"></stop>
    <stop offset="100%" stop-color="#03060B"></stop>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7DD3FC"></stop>
    <stop offset="100%" stop-color="#2563EB"></stop>
  </linearGradient>

  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" fill="none" stroke="#334155" stroke-opacity=".18"></path>
  </pattern>

  <filter id="soft">
    <feGaussianBlur stdDeviation="12"></feGaussianBlur>
  </filter>

</defs>

<!-- BACKGROUND -->

<rect width="1180" height="610" rx="28" fill="url(#bg)"></rect>

<rect x="1" y="1" width="1178" height="608" rx="28" fill="none" stroke="#334155" stroke-opacity=".55"></rect>

<rect x="30" y="30" width="1120" height="550" rx="20" fill="url(#grid)"></rect>

<!-- subtle blue atmosphere -->

<circle cx="260" cy="290" r="150" fill="#2563EB" opacity=".07" filter="url(#soft)">
  <animate attributeName="opacity" values=".03;.09;.03" dur="5s" repeatCount="indefinite"></animate>
</circle>

<!-- LEFT IDENTITY PANEL -->

<rect x="70" y="80" width="420" height="450" rx="18" fill="#08111D" stroke="#334155" stroke-opacity=".7"></rect>

<!-- MZ DOT MATRIX -->

<g fill="#E2E8F0">

  <!-- M -->

  <circle cx="135" cy="170" r="5">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.2s" begin="0s" repeatCount="indefinite"></animate>
  </circle>

  <circle cx="135" cy="200" r="5"></circle>
  <circle cx="135" cy="230" r="5"></circle>
  <circle cx="135" cy="260" r="5"></circle>
  <circle cx="135" cy="290" r="5"></circle>
  <circle cx="165" cy="200" r="5"></circle>
  <circle cx="195" cy="230" r="5"></circle>
  <circle cx="225" cy="200" r="5"></circle>
  <circle cx="255" cy="170" r="5"></circle>
  <circle cx="255" cy="200" r="5"></circle>
  <circle cx="255" cy="230" r="5"></circle>
  <circle cx="255" cy="260" r="5"></circle>
  <circle cx="255" cy="290" r="5"></circle>

  <!-- Z -->

  <circle cx="300" cy="170" r="5"></circle>
  <circle cx="330" cy="170" r="5"></circle>
  <circle cx="360" cy="170" r="5"></circle>
  <circle cx="390" cy="170" r="5"></circle>

  <circle cx="360" cy="200" r="5"></circle>
  <circle cx="330" cy="230" r="5"></circle>
  <circle cx="300" cy="260" r="5"></circle>

  <circle cx="300" cy="290" r="5"></circle>
  <circle cx="330" cy="290" r="5"></circle>
  <circle cx="360" cy="290" r="5"></circle>
  <circle cx="390" cy="290" r="5"></circle>

</g>

<!-- BLUE ACCENT -->

<circle cx="430" cy="170" r="5" fill="#7DD3FC">

  <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"></animate>

  <animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"></animate>
</circle>

<!-- IDENTITY TEXT -->

<text x="110" y="370" fill="#F8FAFC" font-family="monospace" font-size="25" letter-spacing="5">
MANAL ZAREEN
</text>

<text x="110" y="405" fill="#94A3B8" font-family="monospace" font-size="14" letter-spacing="2">
CSE (AI &amp; ML) · DEVELOPER
</text>

<line x1="110" y1="435" x2="450" y2="435" stroke="#334155"></line>

<text x="110" y="470" fill="#7DD3FC" font-family="monospace" font-size="14">
somewhere between code
</text>

<text x="110" y="494" fill="#CBD5E1" font-family="monospace" font-size="14">
&amp; curiosity.
</text>

<!-- RIGHT SYSTEM PANEL -->

<rect x="545" y="80" width="565" height="450" rx="18" fill="#050B13" stroke="#334155" stroke-opacity=".7"></rect>

<!-- terminal header -->

<circle cx="580" cy="115" r="5" fill="#475569"></circle>
<circle cx="600" cy="115" r="5" fill="#475569"></circle>
<circle cx="620" cy="115" r="5" fill="#475569"></circle>

<text x="660" y="120" fill="#64748B" font-family="monospace" font-size="12">
MANAL / SYSTEM.INFO
</text>

<line x1="575" y1="145" x2="1080" y2="145" stroke="#334155"></line>

<!-- system info -->

<text x="585" y="185" fill="#64748B" font-family="monospace" font-size="13">
$ whoami
</text>

<text x="585" y="215" fill="#F8FAFC" font-family="monospace" font-size="16">
manal_zareen
</text>

<text x="585" y="260" fill="#64748B" font-family="monospace" font-size="13">
$ role
</text>

<text x="585" y="290" fill="#CBD5E1" font-family="monospace" font-size="15">
CSE (AI &amp; ML) · Developer
</text>

<text x="585" y="335" fill="#64748B" font-family="monospace" font-size="13">
$ focus
</text>

<text x="585" y="365" fill="#CBD5E1" font-family="monospace" font-size="15">
Web · Python · AI experiments
</text>

<text x="585" y="410" fill="#64748B" font-family="monospace" font-size="13">
$ status
</text>

<text x="585" y="440" fill="#7DD3FC" font-family="monospace" font-size="15">
BUILDING
</text>

<rect x="585" y="465" width="495" height="1" fill="#334155"></rect>

<text x="585" y="500" fill="#64748B" font-family="monospace" font-size="12">
Python · JavaScript · React · Git
</text>

<!-- cursor -->

<rect x="585" y="515" width="9" height="16" fill="#7DD3FC">

  <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"></animate>
</rect>

<!-- SCAN LINE -->

<rect x="45" y="80" width="2" height="450" fill="#7DD3FC" opacity=".45">

  <animate attributeName="x" values="45;1135;45" dur="8s" repeatCount="indefinite"></animate>
</rect>

</svg>